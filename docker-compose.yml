version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: biblia-game-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: biblia
      POSTGRES_PASSWORD: biblia_secret_2026
      POSTGRES_DB: biblia_game
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
